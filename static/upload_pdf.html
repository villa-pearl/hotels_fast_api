<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Загрузка PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --ink: #0f1c2e;
    --muted: #5a6b7d;
    --line: rgba(15, 28, 46, 0.12);
    --surface: rgba(255, 255, 255, 0.72);
    --surface-solid: #f7f9fc;
    --accent: #0d7377;
    --accent-hover: #095c5f;
    --accent-soft: rgba(13, 115, 119, 0.1);
    --danger: #b42318;
    --ok: #0d7377;
    --shadow: 0 18px 50px rgba(15, 28, 46, 0.08);
    --radius: 16px;
    --font: "Outfit", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    color: var(--ink);
    background:
        radial-gradient(1200px 600px at 10% -10%, rgba(13, 115, 119, 0.14), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(47, 84, 150, 0.1), transparent 50%),
        linear-gradient(165deg, #e8eef5 0%, #f4f7fb 45%, #eef3f1 100%);
    background-attachment: fixed;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
}

.page {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 56px;
}

.header {
    margin-bottom: 28px;
    animation: rise 0.55s ease both;
}

.header h1 {
    margin: 0 0 8px;
    font-size: clamp(1.75rem, 3vw, 2.25rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
}

.header p {
    margin: 0;
    max-width: 42ch;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
}

.layout {
    display: grid;
    grid-template-columns: minmax(280px, 340px) 1fr;
    gap: 20px;
    align-items: stretch;
    animation: rise 0.7s ease 0.08s both;
}

.panel {
    background: var(--surface);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

.panel-upload {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.panel-label {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
}

.dropzone {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 168px;
    padding: 20px;
    border: 1.5px dashed rgba(13, 115, 119, 0.35);
    border-radius: 12px;
    background: var(--accent-soft);
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}

.dropzone:hover,
.dropzone:focus-within {
    border-color: var(--accent);
    background: rgba(13, 115, 119, 0.14);
    transform: translateY(-1px);
}

.dropzone strong {
    font-size: 1rem;
    font-weight: 600;
}

.dropzone span {
    font-size: 0.9rem;
    color: var(--muted);
}

.dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
}

.file-name {
    min-height: 1.25rem;
    font-size: 0.9rem;
    color: var(--muted);
    word-break: break-all;
}

.file-name.has-file {
    color: var(--ink);
    font-weight: 500;
}

button {
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}

button:hover {
    background: var(--accent-hover);
    box-shadow: 0 8px 20px rgba(13, 115, 119, 0.28);
}

button:active {
    transform: translateY(1px);
}

button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

.btn-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

button.btn-secondary {
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
}

button.btn-secondary:hover {
    background: var(--accent-soft);
    border-color: rgba(13, 115, 119, 0.35);
    box-shadow: none;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: transparent;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
}

.modal.is-open {
    opacity: 1;
    visibility: visible;
}

.modal-dialog {
    position: absolute;
    display: flex;
    flex-direction: column;
    width: min(960px, calc(100vw - 48px));
    height: min(88vh, 900px);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 24px 60px rgba(15, 28, 46, 0.22);
    overflow: hidden;
    opacity: 0;
    pointer-events: auto;
    transition: opacity 0.2s ease;
}

.modal.is-open .modal-dialog {
    opacity: 1;
}

.modal-dialog.is-dragging {
    transition: none;
    user-select: none;
}

.modal-dialog.is-dragging .modal-body iframe {
    pointer-events: none;
}

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-solid);
    cursor: move;
    touch-action: none;
}

.modal-head h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
}

.modal-close {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 8px;
    color: var(--ink);
    background: transparent;
    font-size: 1.35rem;
    line-height: 1;
    cursor: pointer;
}

.modal-close:hover {
    background: rgba(15, 28, 46, 0.06);
    box-shadow: none;
}

.modal-body {
    flex: 1;
    min-height: 0;
    background: #e8eef5;
}

.modal-body iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
}

.status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface-solid);
    border: 1px solid var(--line);
    font-size: 0.92rem;
    color: var(--muted);
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.status::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
    opacity: 0.7;
}

.status.is-loading {
    color: #9a6700;
    background: #fff8e8;
    border-color: rgba(154, 103, 0, 0.2);
}

.status.is-ok {
    color: var(--ok);
    background: rgba(13, 115, 119, 0.08);
    border-color: rgba(13, 115, 119, 0.2);
}

.status.is-error {
    color: var(--danger);
    background: #fff1f0;
    border-color: rgba(180, 35, 24, 0.2);
}

.panel-result {
    display: flex;
    flex-direction: column;
    min-height: 420px;
    overflow: hidden;
}

.panel-result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
}

.panel-result-head h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
}

.duration {
    margin: 0;
    font-family: var(--mono);
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
}

.duration.is-set {
    color: var(--accent);
}

.result-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 360px;
    padding: 16px 20px 20px;
    overflow: auto;
}

.meta {
    margin: 0;
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.45;
}

.meta strong {
    color: var(--ink);
    font-weight: 600;
}

.placeholder {
    margin: auto 0;
    color: #8a97a8;
    font-family: var(--mono);
    font-size: 0.86rem;
    line-height: 1.55;
}

.table-wrap {
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.55);
}

table.price-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.98rem;
}

.price-table th,
.price-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: middle;
    white-space: nowrap;
}

.price-table th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #eef3f7;
    font-weight: 600;
    font-size: 0.89rem;
    letter-spacing: 0.01em;
    color: var(--muted);
}

.price-table th:first-child,
.price-table td:first-child {
    position: sticky;
    left: 0;
    z-index: 2;
    min-width: 180px;
    white-space: normal;
    background: #f4f7fb;
    font-weight: 500;
}

.price-table th:first-child {
    z-index: 3;
    background: #e8eef5;
}

.price-table .room-name {
    display: block;
}

.price-table .header-sub {
    display: block;
    margin-top: 2px;
    font-weight: 400;
    color: var(--muted);
}

.price-table .price-type-badge {
    display: inline-block;
    margin-top: 2px;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.85em;
    font-weight: 600;
    letter-spacing: 0.04em;
}

.price-table tbody tr:last-child td {
    border-bottom: none;
}

.price-table tbody tr:hover td {
    background: rgba(13, 115, 119, 0.06);
}

.price-table tbody tr:hover td:first-child {
    background: rgba(13, 115, 119, 0.1);
}

.price-table td.price {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
}

.error-text {
    margin: 0;
    color: var(--danger);
    font-family: var(--mono);
    font-size: 0.86rem;
    white-space: pre-wrap;
    word-break: break-word;
}

.panel-json {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: rise 0.7s ease 0.12s both;
}

.panel-json .panel-result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
}

.panel-json .panel-result-head h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
}

.ai-res-raw {
    width: 100%;
    min-height: 220px;
    margin: 0;
    padding: 16px 20px;
    border: none;
    resize: vertical;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.82rem;
    line-height: 1.5;
}

.ai-res-raw::placeholder {
    color: #8a97a8;
}

@keyframes rise {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 820px) {
    .page {
        padding: 28px 16px 40px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .panel-result {
        min-height: 320px;
    }

    .result-body {
        min-height: 280px;
    }
}
</style>
</head>
<body>

<div class="page">
    <header class="header">
        <h1>Загрузка PDF</h1>
        <p>Загрузите прайс-лист отеля — сервис извлечёт структуру и вернёт таблицу с ценами по номерам.</p>
    </header>

    <div class="layout">
        <aside class="panel panel-upload">
            <p class="panel-label">Файл</p>

            <label class="dropzone" for="pdfFile">
                <strong>Выберите PDF</strong>
                <span>или перетащите файл сюда</span>
                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf">
            </label>

            <div class="file-name" id="fileName">Файл не выбран</div>

            <div class="btn-row">
                <button type="button" id="sendBtn" onclick="sendFile()">
                    Отправить
                </button>
                <button type="button" id="viewPdfBtn" class="btn-secondary" onclick="openPdfModal()" disabled>
                    Просмотреть PDF
                </button>
            </div>

            <p class="status" id="status">Готов</p>
        </aside>

        <section class="panel panel-result">
            <div class="panel-result-head">
                <h2>Результат</h2>
                <p class="duration" id="duration">Длительность: —</p>
            </div>
            <div class="result-body" id="result">
                <p class="placeholder">Здесь появится таблица цен…</p>
            </div>
        </section>
    </div>

    <section class="panel panel-json">
        <div class="panel-result-head">
            <h2>ai_res JSON</h2>
        </div>
        <textarea
            id="aiResRaw"
            class="ai-res-raw"
            readonly
            placeholder="Здесь появится полный JSON из ai_res…"></textarea>
    </section>
</div>

<div class="modal" id="pdfModal" role="dialog" aria-modal="true" aria-labelledby="pdfModalTitle" hidden>
    <div class="modal-dialog">
        <div class="modal-head">
            <h2 id="pdfModalTitle">PDF</h2>
            <button type="button" class="modal-close" id="pdfModalClose" aria-label="Закрыть">&times;</button>
        </div>
        <div class="modal-body">
            <iframe id="pdfViewer" title="Просмотр PDF"></iframe>
        </div>
    </div>
</div>

<script>

const fileInput = document.getElementById("pdfFile");
const fileName = document.getElementById("fileName");
const status = document.getElementById("status");
const result = document.getElementById("result");
const aiResRaw = document.getElementById("aiResRaw");
const sendBtn = document.getElementById("sendBtn");
const viewPdfBtn = document.getElementById("viewPdfBtn");
const durationEl = document.getElementById("duration");
const pdfModal = document.getElementById("pdfModal");
const pdfModalDialog = pdfModal.querySelector(".modal-dialog");
const pdfModalHead = pdfModal.querySelector(".modal-head");
const pdfModalTitle = document.getElementById("pdfModalTitle");
const pdfModalClose = document.getElementById("pdfModalClose");
const pdfViewer = document.getElementById("pdfViewer");

let selectedPdfFile = null;
let pdfObjectUrl = null;
let dragState = null;

fileInput.addEventListener("change", () => {
    if (fileInput.files.length === 0) {
        selectedPdfFile = null;
        viewPdfBtn.disabled = true;
        fileName.textContent = "Файл не выбран";
        fileName.classList.remove("has-file");
        return;
    }
    selectedPdfFile = fileInput.files[0];
    viewPdfBtn.disabled = false;
    fileName.textContent = selectedPdfFile.name;
    fileName.classList.add("has-file");
});

function setStatus(text, kind) {
    status.textContent = text;
    status.classList.remove("is-loading", "is-ok", "is-error");
    if (kind) status.classList.add(kind);
}

function formatDuration(ms) {
    if (ms < 1000) return Math.round(ms) + " мс";
    return (ms / 1000).toFixed(2).replace(".", ",") + " сек";
}

function setDuration(text, isSet) {
    durationEl.textContent = text;
    durationEl.classList.toggle("is-set", Boolean(isSet));
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function parseAiRes(aiRes) {
    if (aiRes == null) return null;
    if (typeof aiRes === "object") return aiRes;

    let text = String(aiRes).trim();
    const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fenced) text = fenced[1].trim();

    return JSON.parse(text);
}

function formatPrice(value) {
    if (value == null || value === "") return "—";
    return escapeHtml(value);
}

function formatPeriod(period) {
    if (period == null) return "";
    const text = String(period).trim();
    const pad = (n) => String(n).padStart(2, "0");

    // 01/11/2026/23/12/2026  или  01-11-2026/23-12-2026
    const full = text.match(
        /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})\s*[\/–—-]\s*(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/
    );
    if (full) {
        const [, d1, m1, y1, d2, m2, y2] = full;
        return `${pad(d1)}.${pad(m1)}.${y1} - ${pad(d2)}.${pad(m2)}.${y2}`;
    }

    // 1/1 - 31/8/2026  или  1/11 - 31/12/2026
    const short = text.match(
        /^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{4}))?\s*[\/–—-]\s*(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/
    );
    if (short) {
        const [, d1, m1, y1, d2, m2, y2] = short;
        const startYear = y1 || y2;
        return `${pad(d1)}.${pad(m1)}.${startYear} - ${pad(d2)}.${pad(m2)}.${y2}`;
    }

    return text;
}

function getItemHeaders(item) {
    const raw = item?.headrs ?? item?.headers ?? [];
    if (!Array.isArray(raw)) return [];
    return raw.map((value) => String(value).trim()).filter(Boolean);
}

function headerColumnKey(headers) {
    return headers.join("\0");
}

function isPriceTypeHeader(text) {
    const upper = String(text).trim().toUpperCase();
    return upper === "FIT" || upper === "GIT" || /^FIT\b/.test(upper) || /^GIT\b/.test(upper);
}

function renderHeaderCell(headers) {
    if (!headers.length) return "—";

    const season = headers[0];
    const rest = headers.slice(1);
    let html = `<span class="room-name">${escapeHtml(formatPeriod(season))}</span>`;

    for (const part of rest) {
        const label = formatPeriod(part);
        if (isPriceTypeHeader(part)) {
            html += `<span class="price-type-badge">${escapeHtml(label)}</span>`;
        } else {
            html += `<span class="header-sub">${escapeHtml(label)}</span>`;
        }
    }
    return html;
}

function buildPriceMatrix(items) {
    const columns = [];
    const columnIndex = new Map();
    const rooms = [];
    const roomIndex = new Map();
    const matrix = new Map();

    for (const item of items) {
        const room = String(item?.room ?? "").trim() || "—";
        const headers = getItemHeaders(item);
        const colKey = headerColumnKey(headers) || "_empty";
        const price = item?.price;

        if (!columnIndex.has(colKey)) {
            columnIndex.set(colKey, columns.length);
            columns.push({ key: colKey, headers });
        }

        if (!roomIndex.has(room)) {
            roomIndex.set(room, rooms.length);
            rooms.push(room);
            matrix.set(room, new Map());
        }

        matrix.get(room).set(colKey, price);
    }

    return { columns, rooms, matrix };
}

function formatAiResRaw(aiRes) {
    if (aiRes == null) return "";
    if (typeof aiRes === "object") {
        return JSON.stringify(aiRes, null, 2);
    }

    const text = String(aiRes);
    try {
        return JSON.stringify(parseAiRes(text), null, 2);
    } catch (_) {
        return text;
    }
}

function setAiResRaw(aiRes) {
    aiResRaw.value = formatAiResRaw(aiRes);
}

function renderTable(json) {
    setAiResRaw(json.ai_res);

    let data;
    try {
        data = parseAiRes(json.ai_res);
    } catch (err) {
        result.innerHTML = `<p class="error-text">Не удалось разобрать JSON: ${escapeHtml(err)}</p>`;
        return;
    }

    const items = Array.isArray(data?.prices) ? data.prices : [];
    const { columns, rooms, matrix } = buildPriceMatrix(items);

    const meta =
          `<p class="meta">`
        + `<strong>${escapeHtml(json.filename ?? "")}</strong>`
        + ` · ${escapeHtml(json.size_bytes ?? "")} байт`
        + ` · ${escapeHtml(json.pages ?? "")} стр.`
        + `</p>`;

    if (!rooms.length) {
        result.innerHTML = meta + `<p class="error-text">Нет данных для таблицы</p>`;
        return;
    }

    // Колонки: Номер + уникальные наборы headrs; строки — уникальные room.
    let head = `<tr><th>Номер</th>`;
    for (const column of columns) {
        head += `<th>${renderHeaderCell(column.headers)}</th>`;
    }
    head += `</tr>`;

    let body = "";
    for (const room of rooms) {
        const rowPrices = matrix.get(room) || new Map();
        body += `<tr><td><span class="room-name">${escapeHtml(room)}</span></td>`;
        for (const column of columns) {
            body += `<td class="price">${formatPrice(rowPrices.get(column.key))}</td>`;
        }
        body += `</tr>`;
    }

    result.innerHTML =
          meta
        + `<div class="table-wrap">`
        + `<table class="price-table">`
        + `<thead>${head}</thead>`
        + `<tbody>${body}</tbody>`
        + `</table>`
        + `</div>`;
}

function showPlaceholder() {
    result.innerHTML = `<p class="placeholder">Здесь появится таблица цен…</p>`;
    aiResRaw.value = "";
}

function showError(err) {
    result.innerHTML = `<p class="error-text">${escapeHtml(err)}</p>`;
}

function revokePdfUrl() {
    if (pdfObjectUrl) {
        URL.revokeObjectURL(pdfObjectUrl);
        pdfObjectUrl = null;
    }
}

function centerPdfModal() {
    const pad = 24;
    const width = pdfModalDialog.offsetWidth;
    const height = pdfModalDialog.offsetHeight;
    const left = Math.max(pad, Math.round((window.innerWidth - width) / 2));
    const top = Math.max(pad, Math.round((window.innerHeight - height) / 2));
    pdfModalDialog.style.left = left + "px";
    pdfModalDialog.style.top = top + "px";
}

function openPdfModal() {
    if (!selectedPdfFile) {
        alert("Сначала выберите PDF файл");
        return;
    }

    revokePdfUrl();
    pdfObjectUrl = URL.createObjectURL(selectedPdfFile);
    pdfModalTitle.textContent = selectedPdfFile.name;
    pdfViewer.src = pdfObjectUrl;
    pdfModal.hidden = false;
    centerPdfModal();
    requestAnimationFrame(() => pdfModal.classList.add("is-open"));
}

function closePdfModal() {
    pdfModal.classList.remove("is-open");
    const onEnd = () => {
        pdfModal.hidden = true;
        pdfViewer.src = "";
        revokePdfUrl();
        pdfModal.removeEventListener("transitionend", onEnd);
    };
    pdfModal.addEventListener("transitionend", onEnd);
}

pdfModalHead.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".modal-close")) return;
    if (e.button !== 0) return;

    const rect = pdfModalDialog.getBoundingClientRect();
    dragState = {
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top,
        moved: false,
    };
    pdfModalDialog.classList.add("is-dragging");
    pdfModalHead.setPointerCapture(e.pointerId);
});

pdfModalHead.addEventListener("pointermove", (e) => {
    if (!dragState) return;

    dragState.moved = true;
    const left = e.clientX - dragState.offsetX;
    const top = e.clientY - dragState.offsetY;
    pdfModalDialog.style.left = left + "px";
    pdfModalDialog.style.top = top + "px";
});

function endDrag(e) {
    if (!dragState) return;
    pdfModalDialog.classList.remove("is-dragging");
    try {
        pdfModalHead.releasePointerCapture(e.pointerId);
    } catch (_) {}
    dragState = null;
}

pdfModalHead.addEventListener("pointerup", endDrag);
pdfModalHead.addEventListener("pointercancel", endDrag);

pdfModalClose.addEventListener("click", closePdfModal);
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && pdfModal.classList.contains("is-open")) {
        closePdfModal();
    }
});

async function sendFile() {
    if (fileInput.files.length === 0) {
        alert("Выберите PDF файл");
        return;
    }

    const selectedFile = fileInput.files[0];
    selectedPdfFile = selectedFile;
    const formData = new FormData();
    formData.append("pdf_file", selectedFile);

    sendBtn.disabled = true;
    setStatus("Файл отправляется… Ожидание ответа сервера…", "is-loading");
    setDuration("Длительность: …", false);
    showPlaceholder();

    const startedAt = performance.now();

    try {
        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const json = await response.json();
        const elapsedMs = performance.now() - startedAt;

        if (json.error) {
            throw new Error(json.error);
        }

        renderTable(json);
        setDuration("Длительность: " + formatDuration(elapsedMs), true);
        setStatus("Готово", "is-ok");
    } catch (err) {
        const elapsedMs = performance.now() - startedAt;
        setDuration("Длительность: " + formatDuration(elapsedMs), true);
        setStatus("Ошибка", "is-error");
        showError(err);
    } finally {
        sendBtn.disabled = false;
        viewPdfBtn.disabled = !selectedPdfFile;
    }
}

</script>
