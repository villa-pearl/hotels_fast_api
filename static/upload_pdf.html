<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Загрузка PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --ink: #0f1c2e;
    --muted: #5a6b7d;
    --line: rgba(15, 28, 46, 0.12);
    --surface: rgba(255, 255, 255, 0.72);
    --surface-solid: #f7f9fc;
    --accent: #0d7377;
    --accent-hover: #095c5f;
    --accent-soft: rgba(13, 115, 119, 0.1);
    --danger: #b42318;
    --ok: #0d7377;
    --shadow: 0 18px 50px rgba(15, 28, 46, 0.08);
    --radius: 16px;
    --font: "Outfit", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    color: var(--ink);
    background:
        radial-gradient(1200px 600px at 10% -10%, rgba(13, 115, 119, 0.14), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(47, 84, 150, 0.1), transparent 50%),
        linear-gradient(165deg, #e8eef5 0%, #f4f7fb 45%, #eef3f1 100%);
    background-attachment: fixed;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
}

.page {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 56px;
}

.header {
    margin-bottom: 28px;
    animation: rise 0.55s ease both;
}

.header h1 {
    margin: 0 0 8px;
    font-size: clamp(1.75rem, 3vw, 2.25rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
}

.header p {
    margin: 0;
    max-width: 42ch;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
}

.layout {
    display: grid;
    grid-template-columns: minmax(280px, 340px) 1fr;
    gap: 20px;
    align-items: stretch;
    animation: rise 0.7s ease 0.08s both;
}

.panel {
    background: var(--surface);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

.panel-upload {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.panel-label {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
}

.dropzone {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 168px;
    padding: 20px;
    border: 1.5px dashed rgba(13, 115, 119, 0.35);
    border-radius: 12px;
    background: var(--accent-soft);
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}

.dropzone:hover,
.dropzone:focus-within {
    border-color: var(--accent);
    background: rgba(13, 115, 119, 0.14);
    transform: translateY(-1px);
}

.dropzone strong {
    font-size: 1rem;
    font-weight: 600;
}

.dropzone span {
    font-size: 0.9rem;
    color: var(--muted);
}

.dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
}

.file-name {
    min-height: 1.25rem;
    font-size: 0.9rem;
    color: var(--muted);
    word-break: break-all;
}

.file-name.has-file {
    color: var(--ink);
    font-weight: 500;
}

button {
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}

button:hover {
    background: var(--accent-hover);
    box-shadow: 0 8px 20px rgba(13, 115, 119, 0.28);
}

button:active {
    transform: translateY(1px);
}

button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

.status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface-solid);
    border: 1px solid var(--line);
    font-size: 0.92rem;
    color: var(--muted);
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.status::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
    opacity: 0.7;
}

.status.is-loading {
    color: #9a6700;
    background: #fff8e8;
    border-color: rgba(154, 103, 0, 0.2);
}

.status.is-ok {
    color: var(--ok);
    background: rgba(13, 115, 119, 0.08);
    border-color: rgba(13, 115, 119, 0.2);
}

.status.is-error {
    color: var(--danger);
    background: #fff1f0;
    border-color: rgba(180, 35, 24, 0.2);
}

.panel-result {
    display: flex;
    flex-direction: column;
    min-height: 420px;
    overflow: hidden;
}

.panel-result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
}

.panel-result-head h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
}

.duration {
    margin: 0;
    font-family: var(--mono);
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
}

.duration.is-set {
    color: var(--accent);
}

textarea {
    flex: 1;
    width: 100%;
    min-height: 360px;
    margin: 0;
    padding: 18px 20px;
    border: none;
    resize: vertical;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.86rem;
    line-height: 1.55;
}

textarea::placeholder {
    color: #8a97a8;
}

@keyframes rise {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 820px) {
    .page {
        padding: 28px 16px 40px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .panel-result {
        min-height: 320px;
    }

    textarea {
        min-height: 280px;
    }
}
</style>
</head>
<body>

<div class="page">
    <header class="header">
        <h1>Загрузка PDF</h1>
        <p>Загрузите прайс-лист отеля — сервис извлечёт структуру и вернёт таблицу с ценами по номерам.</p>
    </header>

    <div class="layout">
        <aside class="panel panel-upload">
            <p class="panel-label">Файл</p>

            <label class="dropzone" for="pdfFile">
                <strong>Выберите PDF</strong>
                <span>или перетащите файл сюда</span>
                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf">
            </label>

            <div class="file-name" id="fileName">Файл не выбран</div>

            <button type="button" id="sendBtn" onclick="sendFile()">
                Отправить
            </button>

            <p class="status" id="status">Готов</p>
        </aside>

        <section class="panel panel-result">
            <div class="panel-result-head">
                <h2>Результат</h2>
                <p class="duration" id="duration">Длительность: —</p>
            </div>
            <textarea
                id="result"
                readonly
                placeholder="Здесь появится ответ сервера..."></textarea>
        </section>
    </div>
</div>

<script>

const fileInput = document.getElementById("pdfFile");
const fileName = document.getElementById("fileName");
const status = document.getElementById("status");
const result = document.getElementById("result");
const sendBtn = document.getElementById("sendBtn");
const durationEl = document.getElementById("duration");

fileInput.addEventListener("change", () => {
    if (fileInput.files.length === 0) {
        fileName.textContent = "Файл не выбран";
        fileName.classList.remove("has-file");
        return;
    }
    fileName.textContent = fileInput.files[0].name;
    fileName.classList.add("has-file");
});

function setStatus(text, kind) {
    status.textContent = text;
    status.classList.remove("is-loading", "is-ok", "is-error");
    if (kind) status.classList.add(kind);
}

function formatDuration(ms) {
    if (ms < 1000) return Math.round(ms) + " мс";
    return (ms / 1000).toFixed(2).replace(".", ",") + " сек";
}

function setDuration(text, isSet) {
    durationEl.textContent = text;
    durationEl.classList.toggle("is-set", Boolean(isSet));
}

async function sendFile() {
    if (fileInput.files.length === 0) {
        alert("Выберите PDF файл");
        return;
    }

    const formData = new FormData();
    formData.append("pdf_file", fileInput.files[0]);

    sendBtn.disabled = true;
    setStatus("Файл отправляется… Ожидание ответа сервера…", "is-loading");
    setDuration("Длительность: …", false);
    result.value = "";

    const startedAt = performance.now();

    try {
        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const json = await response.json();
        const elapsedMs = performance.now() - startedAt;

        result.value =
              "Имя файла: " + json.filename + "\n"
            + "Размер: " + json.size_bytes + " байт\n"
            + "Количество страниц: " + json.pages + "\n\n"
            + "AI результат:\n"
            + (json.ai_res ?? "");

        setDuration("Длительность: " + formatDuration(elapsedMs), true);
        setStatus("Готово", "is-ok");
    } catch (err) {
        const elapsedMs = performance.now() - startedAt;
        setDuration("Длительность: " + formatDuration(elapsedMs), true);
        setStatus("Ошибка", "is-error");
        result.value = err;
    } finally {
        sendBtn.disabled = false;
    }
}

</script>

</body>
</html>
